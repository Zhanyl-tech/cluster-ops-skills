# Every figure a runbook quotes, and where it came from.
#
# `cluster-ops-skills validate` (and the test suite) fail when a number in any
# skills/*/SKILL.md or skills/*/references/*.md is not covered by an entry here,
# when an entry's text no longer appears exactly once in its file, or when an
# entry is not sourced the way its kind requires. A number is anything written
# in digits, or a spelled-out cardinal from "two" upward ("ninety seconds",
# "tens of seconds"); "one" and ordinals are not detected (see loader.py).
#
# kind:
#   measured      produced by running something. `source` is a commit-pinned
#                 permalink into one of the portfolio repos, `method` says what
#                 was run, and the runbook must link that same permalink.
#   documented    stated by upstream documentation. `source` is the doc URL,
#                 which the runbook must link.
#   illustrative  an example, a piece of reasoning, or a count of things the
#                 runbook itself names -- not a measurement. `note` says which,
#                 and the runbook must not present it as measured.
#
# `text` is matched whitespace-insensitively, so re-wrapping a paragraph does
# not orphan an entry. `file` defaults to SKILL.md.

claims:
  # --- accounting-path-stalled ------------------------------------------------
  - skill: accounting-path-stalled
    text: "t+0s      baseline — sacct ok, node idle, DBD Agent queue size 0"
    kind: measured
    source: &s01 https://github.com/Zhanyl-tech/slurm-rca-bench/blob/469ea760de677295a833f709b7713f06e36abff2/scenarios/S01-storage-stall-scheduling-halt/scenario.yaml
    method: &s01m >-
      slurm-rca-bench S01 verification block (measured: true): the fully probed
      live run on the bench's Docker Compose project, Slurm 25.11.4, single CPU
      worker; the database container paused with `docker pause`; sacct, sinfo,
      sdiag, sbatch and squeue probed every 10-60 s for about 16 minutes; healed
      with `docker unpause` and re-probed. An emulated stall, not a filesystem
      fault. The block also records one observation from a second run (see the
      t+180s entry).
  - skill: accounting-path-stalled
    text: "t+5s      sacct BLOCKS (no return, no error); sinfo still fine"
    kind: measured
    source: *s01
    method: *s01m
  - skill: accounting-path-stalled
    text: "t+60s     DBD Agent queue size 1"
    kind: measured
    source: *s01
    method: *s01m
  - skill: accounting-path-stalled
    text: "t+840s    DBD Agent queue size 6 and climbing; sbatch still accepted"
    kind: measured
    source: *s01
    method: *s01m
  - skill: accounting-path-stalled
    text: "t+900s    submitted jobs reach the node and run; queue drains"
    kind: measured
    source: *s01
    method: *s01m
  - skill: accounting-path-stalled
    text: "heal+10s  sacct returns; queued records flush — jobs COMPLETED"
    kind: measured
    source: *s01
    method: *s01m
  - skill: accounting-path-stalled
    text: "a second run reached the same depth of 6 at t+180s"
    kind: measured
    source: *s01
    method: >-
      slurm-rca-bench S01 verification block, observation "t+180s": "sdiag DBD
      Agent queue size reaches 6 on a second run (make smoke)"; its caveats add
      that "Two runs reached a depth of 6 at t+180s and t+840s respectively".
      The block records only this queue-depth reading for the second run, on
      the same emulated stall (database container paused), not a full probe.
  - skill: accounting-path-stalled
    text: "Job start latency degraded to tens of seconds"
    kind: measured
    source: *s01
    method: >-
      slurm-rca-bench S01 verification caveats, from the fully probed run: "Job
      start latency did degrade to tens of seconds". The block gives no exact
      latency figure.
  - skill: accounting-path-stalled
    text: "the two jobs submitted *during* the stall ran to completion"
    kind: measured
    source: *s01
    method: &s01jobs >-
      slurm-rca-bench S01 verification block, fully probed run: "Jobs 4 and 5
      were submitted while the backend was stalled and both completed", and
      "heal+10s ... jobs 4 and 5 both COMPLETED" in sacct.
  - skill: accounting-path-stalled
    text: "two jobs submitted during the stall"
    kind: measured
    source: *s01
    method: *s01jobs
  - skill: accounting-path-stalled
    text: "Slurm 25.11.4, the database container paused"
    kind: measured
    source: *s01
    method: *s01m
  - skill: accounting-path-stalled
    text: "about 16 minutes"
    kind: measured
    source: *s01
    method: *s01m
  - skill: accounting-path-stalled
    text: "default 10000"
    kind: documented
    source: https://slurm.schedmd.com/slurm.conf.html
    note: MaxDBDMsgs default, "10000, or MaxJobCount * 2 + Node Count * 4, whichever is greater".
  - skill: accounting-path-stalled
    text: "rejected with an I/O error at t+12s"
    kind: measured
    source: &s06 https://github.com/Zhanyl-tech/slurm-rca-bench/blob/469ea760de677295a833f709b7713f06e36abff2/scenarios/S06-state-save-unwritable/scenario.yaml
    method: &s06m >-
      slurm-rca-bench S06 verification block (measured: true): one live run on
      the bench's Compose project, Slurm 25.11.4; `chmod 500` on
      StateSaveLocation inside the slurmctld container, sbatch attempted,
      `chmod 755` restored, sbatch re-attempted, sacct as source of truth.
      A real permission failure ("rather than an emulation of one", in S06's
      own words) on the bench's container cluster. Covers that case only, not
      a hung filesystem.

