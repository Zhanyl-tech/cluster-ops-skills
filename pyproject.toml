[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cluster-ops-skills"
version = "0.2.0"
description = "Operator runbooks for self-managed Slurm and GPU clusters, packaged as Agent Skills, with a validator and a claims ledger that keep their figures checkable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zhanyl Abdybaeva" }]
keywords = ["slurm", "hpc", "agent-skills", "runbooks", "gpu-cluster", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "build>=1.2"]

[project.scripts]
cluster-ops-skills = "cluster_ops_skills.cli:main"

[project.urls]
Homepage = "https://github.com/Zhanyl-tech/cluster-ops-skills"

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_ops_skills"]

# The runbooks and the claims ledger live at the repo root, where the Claude
# Code plugin layout expects `skills/`. A wheel has to carry them inside the
# package, or an installed `cluster-ops-skills` has nothing to list. loader.py
# looks for them in the package first and falls back to the repo root.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "cluster_ops_skills/skills"
"claims.yaml" = "cluster_ops_skills/claims.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["cluster_ops_skills"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests", "scripts"]
python_version = "3.11"
strict = true
mypy_path = "src:tests"
